<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#ff86ad" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="./icons/icon-192.png" />
  <link rel="stylesheet" href="./styles.css" />
  <link rel="stylesheet" href="./pages.css" />
  <title>通常モード · Cat Builder</title>
</head>
<body class="builder-page">
  <div class="bg-sprinkles" aria-hidden="true"></div>
  <header class="topbar">
    <a class="back-home" href="./">← <span>モード選択</span></a>
    <a class="brand compact-brand" href="./"><span class="brand-mark">🐾</span><span><strong>Cat Builder</strong><small>通常モード</small></span></a>
    <div class="top-actions"><a class="mode-jump" href="./random.html">🎲 ランダム</a><button class="icon-btn" id="installBtn" type="button" hidden>📲</button><button class="icon-btn" id="themeBtn" type="button">🌙</button></div>
  </header>

  <main class="app-shell focused-shell">
    <section class="builder-intro card candy-card compact-hero">
      <div>
        <span class="eyebrow">NORMAL MODE ✦</span>
        <h1>理想の猫を、<em>自分でつくる。</em></h1>
        <p>各項目を選ぶだけ。迷った項目は右上の <b>🎲</b> で、その項目だけランダムにできます。</p>
        <div class="mode-switch level-switch" role="group" aria-label="表示する設定の細かさ">
          <button data-mode="easy" class="mode-btn active">🌷 基本</button>
          <button data-mode="detail" class="mode-btn">🧁 詳細</button>
          <button data-mode="madness" class="mode-btn">🧬 全項目</button>
        </div>
      </div>
      <div class="mini-preview-wrap">
        <div class="preview-badge" id="previewBadge">TODAY'S CAT</div>
        <svg id="catPreview" class="cat-preview" viewBox="0 0 340 300" role="img" aria-label="猫プレビュー">
          <g class="cat-group">
            <path class="tail" d="M255 205 C315 178, 320 245, 281 253 C252 259, 258 231, 278 231" />
            <ellipse class="body" cx="184" cy="205" rx="93" ry="70" /><ellipse class="chest" cx="147" cy="218" rx="36" ry="42" />
            <path class="ear" d="M104 88 L126 36 L153 91 Z" /><path class="ear" d="M199 91 L231 40 L243 106 Z" />
            <circle class="head" cx="174" cy="125" r="78" /><path class="face-patch" d="M118 120 C128 74 170 69 185 96 C203 76 229 95 231 127 C224 166 194 188 169 188 C138 187 116 161 118 120Z" />
            <ellipse class="eye" cx="147" cy="124" rx="13" ry="16" /><ellipse class="eye" cx="202" cy="124" rx="13" ry="16" />
            <ellipse class="pupil" cx="147" cy="125" rx="5" ry="10" /><ellipse class="pupil" cx="202" cy="125" rx="5" ry="10" />
            <path class="nose" d="M169 148 Q175 143 181 148 Q176 157 169 148Z" /><path class="mouth" d="M175 155 Q167 164 159 158 M175 155 Q183 164 192 158" />
            <g class="whiskers"><path d="M150 154 L92 145 M150 162 L88 165 M198 154 L254 143 M198 162 L258 167" /></g>
            <ellipse class="paw" cx="130" cy="260" rx="31" ry="18" /><ellipse class="paw" cx="191" cy="260" rx="31" ry="18" />
          </g>
        </svg>
        <div class="cat-summary" id="catSummary">ラグドール · ブルーポイント · ブルー</div>
      </div>
    </section>

    <section class="builder-layout simplified-builder">
      <aside class="category-nav card" id="categoryNav" aria-label="カテゴリ"></aside>
      <section class="builder-main">
        <div class="builder-toolbar card">
          <label class="search-box">🔎 <input id="settingSearch" type="search" placeholder="設定を検索… 例：目、しっぽ、85mm" /></label>
          <div class="counter-pill"><span id="visibleCount">0</span> 項目</div>
        </div>
        <div id="settingsRoot"></div>
      </section>
    </section>

    <section class="card extras-card single-extras">
      <div class="section-title-row"><div><span class="eyebrow">FINISHING</span><h2>✨ 最後のひとこと</h2></div></div>
      <textarea id="customNote" rows="3" placeholder="例：首元の毛だけ少し寝癖っぽく。少しだけ首をかしげる。"></textarea>
      <details class="negative-details"><summary>避けたい要素を設定</summary><div class="negative-grid" id="negativeGrid"></div></details>
    </section>

    <section class="prompt-panel card sticky-result" id="promptPanel">
      <div class="section-title-row prompt-heading">
        <div><span class="eyebrow">PROMPT</span><h2>🐈‍⬛ できあがり</h2></div>
        <div class="prompt-langs"><button class="lang-btn active" data-lang="ja">日本語</button><button class="lang-btn" data-lang="en">English</button></div>
      </div>
      <div class="target-tabs" id="targetTabs">
        <button class="target-tab active" data-target="chatgpt">ChatGPT</button><button class="target-tab" data-target="gemini">Gemini</button><button class="target-tab" data-target="midjourney">Midjourney</button><button class="target-tab" data-target="flux">FLUX / SD</button><button class="target-tab" data-target="plain">汎用</button>
      </div>
      <div class="prompt-box"><textarea id="promptOutput" rows="9" spellcheck="false"></textarea><button id="copyBtn" class="copy-float" type="button">📋 コピー</button></div>
      <div class="send-grid"><button class="ai-button chatgpt" data-ai="chatgpt"><span>✦</span> ChatGPTへ</button><button class="ai-button gemini" data-ai="gemini"><span>✧</span> Geminiへ</button><button class="ai-button claude" data-ai="claude"><span>✽</span> Claudeへ</button><button class="ai-button share" id="shareBtn"><span>↗</span> 共有</button></div>
    </section>
  </main>

  <div class="app-compat" hidden>
    <div id="randomPresets"></div><button id="lockAllBtn"></button><input id="profileName"><button id="saveProfileBtn"></button><div id="profilesList"></div>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script>try{const d=JSON.parse(localStorage.getItem('catbuilder.draft')||'null');if(d){d.locks={};localStorage.setItem('catbuilder.draft',JSON.stringify(d));}}catch{} localStorage.removeItem('catbuilder.profiles');</script>
  <script src="./app.js" defer></script>
</body>
</html>
